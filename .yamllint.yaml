extends: default

ignore: |
  web/node_modules/
  web/dist/
  test/perf/editor/node_modules/
  test/perf/editor/dist/

rules:
  document-start: disable
  line-length:
    max: 140
    level: warning
  truthy:
    # GitHub Actions uses the `on:` key.
    check-keys: false
  comments:
    min-spaces-from-content: 1
