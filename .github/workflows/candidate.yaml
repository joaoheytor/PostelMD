# Candidate images from main (docs/ci-cd.md §3 and §4): signed, attested, GHCR only.
# Candidates are not releases: this workflow never touches Docker Hub and never applies a
# version tag or `latest`. A PR that changes how the image is built runs the `build` job
# only (no secrets, read-only token), so the PR itself exercises the whole push path against
# a local registry; only the GHCR login, signing, attesting and tagging are main-only.
#
# `publish` doesn't wait for ci.yaml: the `required` check already gated the merge, and a
# candidate is not for users.
name: candidate

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/candidate.yaml
      - Dockerfile
      - .dockerignore
      - Makefile
      - scripts/candidate-gate.sh
      - scripts/image-*.sh

permissions: {}

env:
  IMAGE_REPO: ghcr.io/joaoheytor/postelmd
  # cosign v3.1.4: hash of cosign-linux-amd64, as in cosign_checksums.txt, and the binary's
  # own signature verified against the Sigstore project's release identity.
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa

jobs:
  build:
    # Builds the binaries once, pushes the multi-arch image by digest to a registry on this
    # runner (make image-push, as `publish` does), then gates it per platform digest
    # (make image-gate: smoke tests and Trivy on linux/amd64, Trivy on linux/arm64, a Syft
    # SBOM of each). The arm64 binary is *run* on every commit by ci.yaml's image-arm64 job.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: candidate-build-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      registry:
        image: registry:3.1.2@sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
        ports:
          - 5000:5000
    env:
      LOCAL_REPO: localhost:5000/postelmd
      # Syft v1.55.0: this hash is the one in syft_1.55.0_checksums.txt, whose cosign
      # signature was verified against anchore/syft's release workflow.
      SYFT_VERSION: 1.55.0
      SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
      SYFT_REGISTRY_INSECURE_USE_HTTP: "true" # only the local registry above
    outputs:
      digest: ${{ steps.gate.outputs.digest }}
      amd64: ${{ steps.gate.outputs.amd64 }}
      arm64: ${{ steps.gate.outputs.arm64 }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Host networking and plain HTTP reach the registry service on localhost:5000.
          driver-opts: |
            image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
            network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
      - name: Install Syft
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -sSfL -o "$RUNNER_TEMP/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/tools" syft
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Build the binaries
        # VERSION and COMMIT are explicit, so `git describe --dirty` never runs here.
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          short=${GITHUB_SHA::7}
          if [ "$GITHUB_EVENT_NAME" = push ]; then version=main-$short; else version=pr$PR-$short; fi
          make image-bins VERSION="$version" COMMIT="$short"
          sha256sum bin/linux-amd64/postelmd bin/linux-arm64/postelmd > bin/postelmd.sha256
      - name: Push to the local registry, by digest
        run: make image-push REPO="$LOCAL_REPO"
      - name: Gate each platform digest
        id: gate
        run: |
          make image-gate REPO="$LOCAL_REPO" GATE_DIR=bin/candidate
          {
            echo "digest=$(cat bin/image-digest)"
            echo "amd64=$(cat bin/candidate/digest-amd64)"
            echo "arm64=$(cat bin/candidate/digest-arm64)"
          } >> "$GITHUB_OUTPUT"
      # The gated binaries and SBOMs, for `publish`: it builds no code, so no npm or Go
      # toolchain ever runs with a write token.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: |
            bin/linux-amd64/postelmd
            bin/linux-arm64/postelmd
            bin/postelmd.sha256
            bin/candidate/sbom-amd64.spdx.json
            bin/candidate/sbom-arm64.spdx.json
          retention-days: 3
          if-no-files-found: error

  publish:
    # Only for a push to main in this repository; a PR never reaches this job. A fork PR's
    # token never has `packages: write` or `id-token: write`; a same-repo PR could edit this
    # file, so verifiers pin the signing identity to candidate.yaml@refs/heads/main.
    #
    # It pushes the image of `build`'s binaries again, with the same Makefile target, and
    # fails unless the digest equals the one `build` gated: timestamps are clamped to the
    # commit time (SOURCE_DATE_EPOCH, rewrite-timestamp), so the bytes are identical. Then it
    # signs and attests by digest, and only then tags (ADR-0015 stages 8-11).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'joaoheytor/PostelMD'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # One writer at a time to GHCR's sha256-<digest> referrers tag (GHCR has no OCI referrers
    # API), shared with prerelease.yaml and release.yaml. A running publish is never cancelled.
    concurrency:
      group: ghcr-referrers
      cancel-in-progress: false
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: bin
      - name: Check the binaries are the ones `build` gated
        run: sha256sum -c bin/postelmd.sha256
      - name: Install cosign
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -sSfL -o "$RUNNER_TEMP/tools/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/tools/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tools/cosign"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Push untagged, by digest, and match the gated digest
        env:
          GATED: ${{ needs.build.outputs.digest }}
        run: |
          make image-push REPO="$IMAGE_REPO"
          pushed=$(cat bin/image-digest)
          [ "$pushed" = "$GATED" ] \
            || { echo "::error::pushed $pushed, but build gated $GATED"; exit 1; }
      - name: Sign by digest (cosign keyless; the index and each platform manifest)
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: cosign sign --yes --recursive "$IMAGE_REPO@$DIGEST"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false
      - name: Attest the linux/amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ needs.build.outputs.amd64 }}
          sbom-path: bin/candidate/sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the linux/arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ needs.build.outputs.arm64 }}
          sbom-path: bin/candidate/sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Tag sha-<short>, and main if this is still main's head
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          short=${GITHUB_SHA::7}
          tags="sha-$short"
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            tags="$tags main"
          else
            echo "main is now ${head:-unknown}, not $GITHUB_SHA: leaving :main alone (it never moves backwards)"
          fi
          args=""
          for tag in $tags; do args="$args --tag $IMAGE_REPO:$tag"; done
          # shellcheck disable=SC2086 # one word per --tag argument
          docker buildx imagetools create $args "$IMAGE_REPO@$DIGEST"
          # Fail if a tag doesn't point at exactly the digest that was gated and signed.
          for tag in $tags; do
            got=sha256:$(docker buildx imagetools inspect --raw "$IMAGE_REPO:$tag" | sha256sum | cut -d' ' -f1)
            [ "$got" = "$DIGEST" ] || { echo "::error::$IMAGE_REPO:$tag is $got, not $DIGEST"; exit 1; }
          done
          echo "### Candidate image: \`$IMAGE_REPO@$DIGEST\`, tagged: $tags" >> "$GITHUB_STEP_SUMMARY"
