# Release candidates (docs/ci-cd.md §3-§5, ADR-0015): the ONLY workflow that builds a release
# image. On a signed tag vX.Y.Z-rc.N on main, `build` (no secrets) builds the binaries once,
# pushes the image by digest to a registry on the runner and gates each platform digest, as
# candidate.yaml does. `publish` pushes the same bytes to GHCR untagged, fails unless the
# digest equals the gated one, signs (--recursive) and attests ONCE: build provenance on the
# index and on the binaries, an SPDX SBOM per platform digest. Then it applies :X.Y.Z-rc.N
# and writes the GitHub pre-release record, whose `postelmd-image-digest:` line is what
# release.yaml promotes. It never touches Docker Hub or the stable tags.
#
# Verifiers pin `…/prerelease.yaml@refs/tags/vX.Y.Z-rc.N` and the tagged commit
# (docs/operations/verify-images.md). harden-runner blocks egress: the allowed endpoints are
# those candidate.yaml's and ci.yaml's runs on main reached, plus a cold Go and npm cache
# (no caches here) and the GitHub release upload. A missing endpoint fails closed; the fix is
# a workflow commit and a new RC (docs/operations/releasing.md).
name: prerelease

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions: {}

# Two runs of one RC tag (a re-run while the first still runs) never interleave.
concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/joaoheytor/postelmd
  # cosign v3.1.4: hash of cosign-linux-amd64, as in cosign_checksums.txt, and the binary's
  # own signature verified against the Sigstore project's release identity.
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      registry:
        image: registry:3.1.2@sha256:38907510915c3f1604c7e83d6ab602ab3020d092f73bdaed8696773693ff768c
        ports:
          - 5000:5000
    env:
      LOCAL_REPO: localhost:5000/postelmd
      # Syft v1.55.0: this hash is the one in syft_1.55.0_checksums.txt, whose cosign
      # signature was verified against anchore/syft's release workflow.
      SYFT_VERSION: 1.55.0
      SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
      SYFT_REGISTRY_INSECURE_USE_HTTP: "true" # only the local registry above
    outputs:
      digest: ${{ steps.gate.outputs.digest }}
      amd64: ${{ steps.gate.outputs.amd64 }}
      arm64: ${{ steps.gate.outputs.arm64 }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443 api.github.com:443 release-assets.githubusercontent.com:443
            objects.githubusercontent.com:443 *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            proxy.golang.org:443 sum.golang.org:443 storage.googleapis.com:443 go.dev:443
            dl.google.com:443 registry.npmjs.org:443
            ghcr.io:443 pkg-containers.githubusercontent.com:443 registry-1.docker.io:443
            auth.docker.io:443 production.cloudfront.docker.com:443 gcr.io:443
            mirror.gcr.io:443 check.trivy.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the tag (signed by a trusted key, annotated, on main)
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # checkout can turn an annotated tag into a lightweight one: fetch the tag object.
          git fetch --no-tags --force origin "refs/tags/$TAG:refs/tags/$TAG" \
            refs/heads/main:refs/remotes/origin/main
          scripts/verify-release-tag.sh "$TAG"
          scripts/release-meta.sh parse "$TAG" | tee -a "$GITHUB_OUTPUT"
          grep -qx kind=rc "$GITHUB_OUTPUT" || { echo "::error::$TAG is not an RC tag"; exit 1; }
      # No caches: a release build never restores state another ref could have written.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: |
            image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
            network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true
      - name: Install Syft
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -sSfL -o "$RUNNER_TEMP/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/tools" syft
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Build the binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          make image-bins VERSION="${TAG#v}" COMMIT="${GITHUB_SHA::7}"
          sha256sum bin/linux-amd64/postelmd bin/linux-arm64/postelmd > bin/postelmd.sha256
      - name: Push to the local registry, by digest
        run: make image-push REPO="$LOCAL_REPO"
      - name: Gate each platform digest
        id: gate
        run: |
          make image-gate REPO="$LOCAL_REPO" GATE_DIR=bin/candidate
          {
            echo "digest=$(cat bin/image-digest)"
            echo "amd64=$(cat bin/candidate/digest-amd64)"
            echo "arm64=$(cat bin/candidate/digest-arm64)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prerelease
          path: |
            bin/linux-amd64/postelmd
            bin/linux-arm64/postelmd
            bin/postelmd.sha256
            bin/candidate/sbom-amd64.spdx.json
            bin/candidate/sbom-arm64.spdx.json
          retention-days: 3
          if-no-files-found: error

  publish:
    if: github.repository == 'joaoheytor/PostelMD'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the GitHub pre-release record
      packages: write
      id-token: write
      attestations: write
    # One writer at a time to GHCR's sha256-<digest> referrers tag, shared with
    # candidate.yaml and release.yaml. A running publish is never cancelled.
    concurrency:
      group: ghcr-referrers
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
      DIGEST: ${{ needs.build.outputs.digest }}
      AMD64: ${{ needs.build.outputs.amd64 }}
      ARM64: ${{ needs.build.outputs.arm64 }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443 api.github.com:443 uploads.github.com:443
            release-assets.githubusercontent.com:443 objects.githubusercontent.com:443
            *.actions.githubusercontent.com:443 *.blob.core.windows.net:443
            ghcr.io:443 pkg-containers.githubusercontent.com:443 registry-1.docker.io:443
            auth.docker.io:443 production.cloudfront.docker.com:443 gcr.io:443
            fulcio.sigstore.dev:443 rekor.sigstore.dev:443 timestamp.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prerelease
          path: bin
      - name: Check the binaries are the ones `build` gated
        run: sha256sum -c bin/postelmd.sha256
      - name: Refuse to change an existing pre-release record
        # A re-run must reach the same digest; a different build of the same tag is a new RC.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null); then
            recorded=$(printf '%s\n' "$body" | scripts/release-meta.sh digest)
            [ "$recorded" = "$DIGEST" ] || {
              echo "::error::$TAG already records $recorded, not $DIGEST: tag a new rc.N"; exit 1; }
          fi
      - name: Install cosign
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -sSfL -o "$RUNNER_TEMP/tools/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/tools/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tools/cosign"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Push untagged, by digest, and match the gated digest
        run: |
          make image-push REPO="$IMAGE_REPO"
          pushed=$(cat bin/image-digest)
          [ "$pushed" = "$DIGEST" ] \
            || { echo "::error::pushed $pushed, but build gated $DIGEST"; exit 1; }
      - name: Sign by digest (cosign keyless; the index and each platform manifest)
        run: cosign sign --yes --recursive "$IMAGE_REPO@$DIGEST"
      - name: Attest build provenance (index)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest the linux/amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ needs.build.outputs.amd64 }}
          sbom-path: bin/candidate/sbom-amd64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the linux/arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPO }}
          subject-digest: ${{ needs.build.outputs.arm64 }}
          sbom-path: bin/candidate/sbom-arm64.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Name the release assets
        run: |
          mkdir dist
          cp bin/linux-amd64/postelmd dist/postelmd-linux-amd64
          cp bin/linux-arm64/postelmd dist/postelmd-linux-arm64
          cp bin/candidate/sbom-amd64.spdx.json dist/postelmd-linux-amd64.spdx.json
          cp bin/candidate/sbom-arm64.spdx.json dist/postelmd-linux-arm64.spdx.json
          (cd dist && sha256sum postelmd-* > SHA256SUMS)
      # The binaries and SBOM files: release.yaml verifies each against this identity before
      # it attaches them to the release (it builds nothing).
      - name: Attest build provenance (release assets)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/postelmd-*
          create-storage-record: false
      - name: Tag X.Y.Z-rc.N
        run: |
          ref="$IMAGE_REPO:${TAG#v}"
          docker buildx imagetools create --tag "$ref" "$IMAGE_REPO@$DIGEST"
          got=sha256:$(docker buildx imagetools inspect --raw "$ref" | sha256sum | cut -d' ' -f1)
          [ "$got" = "$DIGEST" ] || { echo "::error::$ref is $got, not $DIGEST"; exit 1; }
      - name: Write the GitHub pre-release record
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Release candidate \`${TAG#v}\` of $GITHUB_SHA, built and gated by $RUN_URL."
            echo "GHCR only, for testing: not a release. Verify it as in docs/operations/verify-images.md."
            echo
            echo "- index: \`$IMAGE_REPO@$DIGEST\`"
            echo "- linux/amd64: \`$AMD64\`"
            echo "- linux/arm64: \`$ARM64\`"
            echo
            echo "release.yaml promotes the digest on the next line; don't edit it."
            echo
            scripts/release-meta.sh digest-line "$DIGEST"
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --draft=false \
              --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --latest=false --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" dist/*
          fi
          echo "### Release candidate: \`$IMAGE_REPO@$DIGEST\` (\`:${TAG#v}\`)" >> "$GITHUB_STEP_SUMMARY"
